<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<title>Overlay — subtitle + motion graphics (telus, 2 lapisan)</title>
<link rel="stylesheet" href="brand.css">
<!--
  Dua lapisan dirender berasingan:
    ?layer=behind  -> kata besar yang berada DI BELAKANG penceramah (text-behind-subject)
    ?layer=front   -> semua elemen lain (subtitle, notifikasi, flow, lower third, hook)
  Komposit: video -> behind -> penceramah (mask) -> front   (lihat tools/final.sh)
-->
<style>
  /* ---------- Subtitle: word-by-word, perkataan aktif dalam pill emas ---------- */
  #cap { position:absolute; left:60px; right:60px; top:1390px; text-align:center;
         font-family:'Poppins'; font-weight:700; font-size:58px; line-height:1.25; color:var(--ivory); }
  #cap span { display:inline-block; margin:0 4px; padding:0 12px; border-radius:14px;
              text-shadow:0 4px 18px rgba(0,0,0,.9), 0 0 3px rgba(0,0,0,.9); }
  #cap span.g { color:var(--gold); }
  #cap span.on { color:var(--charcoal); text-shadow:none;
                 background:linear-gradient(180deg,#f3dfae,#d2ab62); box-shadow:0 6px 22px rgba(216,182,115,.45); }

  /* ---------- Letterbox + flash (cold-open) ---------- */
  .bar { position:absolute; left:0; right:0; height:150px; background:#000; }
  #barT { top:0; } #barB { bottom:0; }
  #flash { position:absolute; inset:0; background:#fff3d6; opacity:0; mix-blend-mode:screen; }
  .shade { position:absolute; left:0; right:0; top:0; height:720px; opacity:0;
           background:linear-gradient(180deg, rgba(12,12,13,.80) 0%, rgba(12,12,13,.5) 55%, transparent 100%); }

  .blk { position:absolute; left:50px; right:50px; top:200px; text-align:center; opacity:0; }
  .kicker { font-family:'Poppins'; font-weight:700; font-size:30px; letter-spacing:8px; color:var(--gold);
            text-shadow:0 3px 12px rgba(0,0,0,.9); }
  .sub { font-family:'Poppins'; font-weight:600; font-size:34px; color:rgba(246,239,226,.92); text-shadow:0 3px 12px rgba(0,0,0,.95); }

  #hook .l { white-space:nowrap; font-family:'Cinzel'; font-weight:900; color:var(--ivory); font-size:56px; letter-spacing:2px; line-height:1.15;
             text-shadow:0 6px 26px rgba(0,0,0,.9); }
  #hook .l3 { font-size:100px; color:var(--gold); text-shadow:0 2px 0 #8a6528, 0 10px 34px rgba(0,0,0,.9); }

  /* ---------- Kata besar di belakang subjek ---------- */
  .bword { position:absolute; left:0; right:0; text-align:center; white-space:nowrap; opacity:0;
           font-family:'Cinzel'; font-weight:900; line-height:1; color:#f2cf86; letter-spacing:2px;
           text-shadow:0 3px 0 #a67c3a, 0 6px 0 #7d5c29, 0 20px 50px rgba(0,0,0,.55), 0 0 70px rgba(242,207,134,.35); }
  .bkick { position:absolute; left:0; right:0; top:215px; text-align:center; opacity:0; }
  .bsub  { position:absolute; left:0; right:0; text-align:center; opacity:0; }

  /* ---------- Tindanan notifikasi ---------- */
  .notif { position:absolute; left:50px; right:50px; top:150px; opacity:0; }
  .nhead { font-family:'Poppins'; font-weight:700; font-size:26px; letter-spacing:6px; color:var(--gold); text-align:center;
           margin-bottom:14px; text-shadow:0 3px 12px rgba(0,0,0,.9); }
  .nc { position:relative; display:flex; align-items:center; gap:24px; padding:20px 28px; margin-bottom:16px; border-radius:30px;
        background:rgba(28,28,32,.70); backdrop-filter:blur(18px) saturate(1.3); border:1px solid rgba(255,255,255,.12);
        box-shadow:0 20px 44px rgba(0,0,0,.42); }
  .nc .ic { width:78px; height:78px; border-radius:20px; flex:none; display:flex; align-items:center; justify-content:center;
            font-family:'Poppins'; font-weight:800; font-size:40px; color:#fff; box-shadow:inset 0 1px 0 rgba(255,255,255,.3); }
  .gold .ic { background:linear-gradient(145deg,#f2d79c,#b98a3e); color:#2a2015; }
  .red  .ic { background:linear-gradient(145deg,#d35a54,#8e2a2c); }
  .nc .bd { flex:1; min-width:0; }
  .nc .lb { font-family:'Poppins'; font-weight:600; font-size:22px; letter-spacing:2px; color:rgba(246,239,226,.62); }
  .nc .tx { font-family:'Poppins'; font-weight:700; font-size:36px; color:var(--ivory); white-space:nowrap; }
  .nc .tm { position:absolute; right:28px; top:20px; font-family:'Poppins'; font-weight:600; font-size:22px; color:rgba(246,239,226,.6); }
  .red .tm { color:#e8817a; font-weight:800; }
  .badge { position:absolute; right:-6px; top:-14px; min-width:44px; height:44px; padding:0 12px; border-radius:22px; background:var(--brick);
           color:#fff; font-family:'Poppins'; font-weight:800; font-size:22px; display:flex; align-items:center; justify-content:center;
           box-shadow:0 6px 16px rgba(0,0,0,.4); opacity:0; }

  /* ---------- Flow sebab-akibat ---------- */
  .flow { display:flex; align-items:stretch; justify-content:center; margin-top:26px; }
  .node { width:270px; padding:22px 16px; border-radius:20px; text-align:center; display:flex; align-items:center; justify-content:center;
          font-family:'Poppins'; font-weight:700; font-size:33px; line-height:1.15; color:var(--ivory);
          background:rgba(20,20,22,.62); border:2px solid var(--gold); box-shadow:0 18px 40px rgba(0,0,0,.45); }
  .arrow { width:44px; display:flex; align-items:center; justify-content:center; color:var(--gold); font-family:'Poppins'; font-weight:800; font-size:40px; }
  .bad .node { border-color:var(--brick); } .bad .arrow { color:#d9675f; }
  .bad .node.last { background:rgba(168,58,60,.88); }
  .good .node.last { background:linear-gradient(180deg,#f1dcab,#d4b06c); color:var(--charcoal); }

  /* ---------- Pill ✓ bercahaya ---------- */
  .check { position:absolute; left:50px; top:1590px; padding:22px 40px; border-radius:60px; opacity:0; white-space:nowrap;
           font-family:'Poppins'; font-weight:800; font-size:38px; letter-spacing:1px; color:#f2cf86;
           background:rgba(16,16,18,.88); border:3px solid #e2c27f;
           box-shadow:0 0 0 1px rgba(242,207,134,.25), 0 0 34px rgba(242,207,134,.55), inset 0 0 18px rgba(242,207,134,.15); }

  /* ---------- Lower third: semua elemen DALAM satu kotak ----------
     Kotak 900x168 @ (40,1560). Grid: [buku 96] | [teks fleksibel] | [TikTok Shop + butang 196] */
  #lt { position:absolute; left:40px; top:1560px; width:900px; height:168px; opacity:0; }
  #lt .panel { position:absolute; inset:0; border-radius:26px; overflow:hidden;
     background:linear-gradient(100deg, rgba(16,16,18,.92), rgba(30,27,23,.86));
     border:1.5px solid rgba(233,211,161,.6); box-shadow:0 20px 44px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.08); }
  #lt .panel .sw { position:absolute; inset:0; background:linear-gradient(100deg, transparent 40%, rgba(255,230,170,.16) 50%, transparent 60%); }
  #lt .row { position:absolute; inset:0; display:flex; align-items:center; padding:0 22px; gap:20px; }
  #lt .bk { position:relative; width:96px; height:134px; flex:none; perspective:600px; }
  #lt .bk .b3 { position:absolute; inset:0; transform-style:preserve-3d; }
  #lt .bk .fr { position:absolute; inset:0; background:url('../assets/cover-buku-rata.jpg') center/cover; border-radius:2px 5px 5px 2px;
     box-shadow:0 10px 22px rgba(0,0,0,.6), inset 3px 0 5px rgba(0,0,0,.25); overflow:hidden; }
  #lt .bk .fr i { position:absolute; inset:-30%; background:linear-gradient(105deg, transparent 42%, rgba(255,240,200,.75) 50%, transparent 58%); mix-blend-mode:screen; }
  #lt .bk .sp { position:absolute; left:0; top:0; width:10px; height:100%; background:linear-gradient(90deg,#d9d2c1,#f3eee2);
     transform-origin:left; transform:rotateY(-90deg); }
  #lt .div { width:2px; height:112px; flex:none; background:linear-gradient(180deg, transparent, rgba(216,182,115,.7), transparent); }
  #lt .tx { flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; gap:6px; }
  #lt .l1 { font-family:'Poppins'; font-weight:600; font-size:18px; letter-spacing:3px; color:var(--gold); white-space:nowrap; line-height:1; }
  #lt .l2 { font-family:'Cinzel'; font-weight:700; font-size:27px; color:var(--ivory); white-space:nowrap; line-height:1.15; }
  #lt .l3 { position:relative; height:28px; overflow:hidden; }
  #lt .l3 div { position:absolute; left:0; top:0; font-family:'Poppins'; font-weight:600; font-size:20px; line-height:28px;
     color:rgba(246,239,226,.9); white-space:nowrap; }
  #lt .l3 b { color:var(--gold); font-weight:800; }
  #lt .act { width:196px; flex:none; display:flex; flex-direction:column; align-items:center; gap:10px; }
  #lt .shop { display:flex; align-items:center; gap:9px; font-family:'Poppins'; font-weight:700; font-size:18px; color:var(--ivory); white-space:nowrap; }
  #lt .shop svg { width:36px; height:36px; flex:none; filter:drop-shadow(0 2px 4px rgba(0,0,0,.4)); }
  #lt .btn { position:relative; width:186px; height:52px; border-radius:30px; display:flex; align-items:center; justify-content:center;
     font-family:'Poppins'; font-weight:800; font-size:21px; letter-spacing:1px; color:var(--charcoal);
     background:linear-gradient(180deg,#f3dfae,#d2ab62); box-shadow:0 8px 18px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.5); }
  #lt .rip { position:absolute; left:50%; top:50%; width:60px; height:60px; margin:-30px 0 0 -30px; border-radius:50%;
     border:3px solid rgba(255,236,190,.95); opacity:0; pointer-events:none; }
  #lt .clip { position:absolute; inset:0; border-radius:26px; overflow:hidden; pointer-events:none; }
  #lt .hand { position:absolute; left:0; top:0; width:74px; height:74px; opacity:0; pointer-events:none; filter:drop-shadow(0 6px 10px rgba(0,0,0,.55)); }

  #word { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; opacity:0;
          background:radial-gradient(ellipse at center, rgba(0,0,0,.35), rgba(0,0,0,.75)); }
  #word div { font-family:'Cinzel'; font-weight:900; font-size:108px; color:var(--gold);
              text-shadow:0 2px 0 #8a6528, 0 12px 40px rgba(0,0,0,.9), 0 0 60px rgba(216,182,115,.4); }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script src="anim.js"></script>
<script>/* ?data=overlay-data-v02.js memilih data video; lalai video 01 */
document.write('<script src="' + (new URLSearchParams(location.search).get('data') || 'overlay-data.js') + '"><\/script>');</script>
<script>
const D = window.DATA;
const LAYER = new URLSearchParams(location.search).get('layer') || 'front';
window.DURATION = D.speech_end;
const EV = (k) => D.events.filter(e => e.kind === k);
const E = (k, i = 0) => EV(k)[i];
const stage = $('stage');
const add = (html) => { const d = document.createElement('div'); d.innerHTML = html.trim(); const el = d.firstElementChild; stage.appendChild(el); return el; };

const hook = E('hook'), W = E('word');
const behinds = EV('behind'), notifs = EV('notif'), flows = EV('flow'), checks = EV('check');

// ===================== BINA DOM =====================
// USP buku (daripada poster rasmi) — bergilir dalam baris 3 lower third
  const LT_LINES = [
    '📖 Dapatkan buku <b>NAK KAHWIN TAPI ..</b>',
    '<b>✓</b> Persediaan <b>emosi</b>, kewangan &amp; pendidikan',
    '<b>✓</b> Komunikasi &amp; <b>resolusi konflik</b> Islamik',
    '<b>✓</b> Hak &amp; tanggungjawab <b>suami isteri</b>',
    '<b>✓</b> <b>Checklist praperkahwinan</b> lengkap'];
let R = {};
if (LAYER === 'behind') {
  R.bw = behinds.map(e => add(`<div class="bword" style="font-size:${e.size}px">${e.word}</div>`));
} else {
  R.shade = add(`<div class="shade"></div>`);
  R.barT = add(`<div class="bar" id="barT"></div>`); R.barB = add(`<div class="bar" id="barB"></div>`);
  R.hook = add(`<div class="blk" id="hook">${hook.lines.map((l, i) => `<div class="l l${i+1}">${l}</div>`).join('')}</div>`);
  R.bk = behinds.map(e => add(`<div class="bkick kicker">${e.kicker}</div>`));
  R.bs = behinds.map(e => add(`<div class="bsub sub">${e.sub}</div>`));
  R.nf = notifs.map(e => add(`<div class="notif ${e.tone}"><div class="nhead">${e.app}</div>` +
      e.items.map((it, i) => `<div class="nc"><div class="ic">${it.icon}</div><div class="bd"><div class="lb">${it.label}</div>` +
        `<div class="tx">${it.t}</div></div><div class="tm">${it.time}</div>` +
        (i === 0 ? `<div class="badge">+${e.items.length}</div>` : '') + `</div>`).join('') + `</div>`));
  R.fl = flows.map(f => add(`<div class="blk"><div class="kicker">${f.title}</div><div class="flow ${f.tone}">` +
      f.items.map((it, i) => (i ? '<div class="arrow">›</div>' : '') + `<div class="node ${i === f.items.length - 1 ? 'last' : ''}">${it.t}</div>`).join('') + '</div></div>'));
  R.ck = checks.map(c => add(`<div class="check">${c.text}</div>`));
  const TT = `<svg viewBox="0 0 48 48"><rect x="1" y="1" width="46" height="46" rx="12" fill="#fff"/>
      <path d="M17 17a7 7 0 0 1 14 0" fill="none" stroke="#111" stroke-width="3.2" stroke-linecap="round"/>
      <rect x="9" y="16" width="30" height="26" rx="6" fill="#111"/>
      <g transform="translate(15.5 19.5) scale(.62)">
        <path d="M14 2v14.5a5.5 5.5 0 1 1-5.5-5.5" fill="none" stroke="#25F4EE" stroke-width="4.5" transform="translate(-1.4 -1.2)"/>
        <path d="M14 2v14.5a5.5 5.5 0 1 1-5.5-5.5" fill="none" stroke="#FE2C55" stroke-width="4.5" transform="translate(1.4 1.2)"/>
        <path d="M14 2v14.5a5.5 5.5 0 1 1-5.5-5.5M14 2c0 4 3 7 7 7" fill="none" stroke="#fff" stroke-width="4.5"/></g></svg>`;
  const HAND = `<svg viewBox="0 0 64 64"><path d="M24 30V12a5 5 0 0 1 10 0v14l3-.6a5 5 0 0 1 5.6 3.3l.4-.1a5 5 0 0 1 6 3.6l.3-.1a5 5 0 0 1 6.3 4.8V45c0 8-6 15-15 15h-6c-5 0-9-3-11.5-7L15 42a5 5 0 0 1 8-6z"
      fill="#fff" stroke="#1b1b1b" stroke-width="2.5" stroke-linejoin="round"/></svg>`;
  R.lt = add(`<div id="lt"><div class="panel"><div class="sw" id="ltsw"></div></div>
    <div class="row">
      <div class="bk"><div class="b3" id="ltb"><div class="sp"></div><div class="fr"><i id="ltfs"></i></div></div></div>
      <div class="div"></div>
      <div class="tx"><div class="l1">PERKONGSIAN DARIPADA PENULIS</div><div class="l2">Waleed Amir &amp; Wardah Kasih</div>
        <div class="l3" id="ltl3">${LT_LINES.map(l => `<div>${l}</div>`).join('')}</div></div>
      <div class="act"><div class="shop">${TT}<span>TikTok Shop</span></div>
        <div class="btn" id="ltbtn">DAPATKAN<div class="rip" id="ltrip"></div></div></div>
    </div>
    <div class="clip"><div class="hand" id="lthand">${HAND}</div></div></div>`);
  R.cap = add(`<div id="cap"></div>`);
  R.word = add(`<div id="word"><div>${W.title}</div></div>`);
  R.flash = add(`<div id="flash"></div>`);
}

const io = (t, e, inD = .5, outD = .4) => range(t, e.start, e.start + inD, easeOut) * (1 - range(t, e.end - outD, e.end));
function pop(el, at, t, dur = .45) {
  const k = range(t, at, at + dur, easeOutBack); el.style.opacity = range(t, at, at + .2);
  el.style.transform = `translateY(${(1 - k) * 40}px) scale(${lerp(.85, 1, k)})`;
}

// Auto-fit: kecilkan saiz fon teks besar yang melebihi lebar frame (sekali, selepas fon dimuat)
let fitted = false;
function fitAll() {
  fitted = true;
  document.querySelectorAll('#hook .l, .bword').forEach(el => {
    const ls = el.style.letterSpacing; el.style.letterSpacing = '2px'; el.style.transform = 'none';
    const max = 990, w = el.scrollWidth > el.clientWidth ? el.scrollWidth : el.getBoundingClientRect().width;
    const range = document.createRange(); range.selectNodeContents(el); const tw = range.getBoundingClientRect().width;
    if (tw > max) el.style.fontSize = (parseFloat(getComputedStyle(el).fontSize) * max / tw) + 'px';
    el.style.letterSpacing = ls;
  });
}
let lastCap = -1;
window.seek = (t) => {
  if (!fitted) fitAll();
  // ===================== LAPISAN BELAKANG =====================
  if (LAYER === 'behind') {
    behinds.forEach((e, i) => {
      const el = R.bw[i], k = range(t, e.word_at, e.word_at + .8, easeOut) * (1 - range(t, e.end - .4, e.end));
      el.style.opacity = k;
      el.style.top = (e.top ?? (e.size > 200 ? 390 : 425)) + 'px';
      el.style.transform = `translateY(${(1 - k) * 60}px) scale(${lerp(1.15, 1, k) + (t - e.word_at) * .004})`;
      el.style.letterSpacing = `${lerp(30, 2, range(t, e.word_at, e.word_at + .9, easeOut))}px`;
    });
    return;
  }

  // ===================== LAPISAN HADAPAN =====================
  // --- cold-open hook
  const hk = t < hook.end + .5;
  const bars = 1 - range(t, hook.end - .2, hook.end + .4, easeInOut);
  R.barT.style.transform = `translateY(${-(1 - bars) * 150}px)`; R.barB.style.transform = `translateY(${(1 - bars) * 150}px)`;
  R.flash.style.opacity = .55 * (1 - range(t, 0, .35)) + .45 * (range(t, hook.end - .08, hook.end) * (1 - range(t, hook.end, hook.end + .3)));
  R.hook.style.opacity = hk ? (1 - range(t, hook.end - .25, hook.end)) : 0;
  R.hook.style.top = '190px';
  [...R.hook.children].forEach((el, i) => {
    const at = [.05, .55, 1.25][i]; const k = range(t, at, at + .5, easeOut);
    el.style.opacity = k; el.style.filter = `blur(${(1 - k) * 10}px)`;
    el.style.transform = `scale(${lerp(1.25, 1, k) + (t - at) * .01})`; el.style.letterSpacing = `${lerp(14, 2, k)}px`;
  });
  let shade = hk ? .75 * (1 - range(t, hook.end - .25, hook.end)) : 0;

  // --- kicker & sub untuk kata di belakang subjek
  behinds.forEach((e, i) => {
    const k = io(t, e); shade = Math.max(shade, k * .55);
    R.bk[i].style.top = (e.top != null ? Math.max(140, e.top - 70) : 215) + 'px';
    R.bk[i].style.opacity = k; R.bk[i].style.transform = `translateY(${(1 - range(t, e.start, e.start + .6, easeOut)) * 20}px)`;
    const s = range(t, e.word_at + .5, e.word_at + 1.1) * (1 - range(t, e.end - .4, e.end));
    R.bs[i].style.opacity = s; R.bs[i].style.top = '268px';
  });

  // --- tindanan notifikasi: jatuh dari atas, setiap kad mendorong yang sebelumnya
  notifs.forEach((e, i) => {
    const el = R.nf[i], k = io(t, e); shade = Math.max(shade, k);
    el.style.opacity = k;
    el.querySelector('.nhead').style.opacity = range(t, e.start, e.start + .5);
    [...el.querySelectorAll('.nc')].forEach((c, j) => {
      const at = e.items[j].at, kk = range(t, at, at + .5, easeOutBack);
      c.style.opacity = range(t, at, at + .25);
      c.style.transform = `translateY(${(1 - kk) * -90}px) scale(${lerp(.9, 1, kk)})`;
      const b = c.querySelector('.badge');
      if (b) { const n = e.items.filter(x => t >= x.at).length; b.textContent = n; b.style.opacity = range(t, at + .3, at + .5);
               const last = Math.max(...e.items.filter(x => t >= x.at).map(x => x.at), at); b.style.transform = `scale(${1 + .35 * (1 - range(t, last, last + .35))})`; }
    });
  });

  // --- flow sebab-akibat
  flows.forEach((f, fi) => {
    const el = R.fl[fi], k = io(t, f); shade = Math.max(shade, k);
    el.style.opacity = k; el.style.transform = `translateY(${(1 - range(t, f.start, f.start + .6, easeOut)) * 30}px)`;
    [...el.querySelector('.flow').children].forEach((n, j) => {
      const idx = Math.floor((j + 1) / 2); const at = f.items[idx].at - (j % 2 ? .25 : 0);
      if (n.classList.contains('arrow')) { const a = range(t, at, at + .3); n.style.opacity = a; n.style.transform = `translateX(${(1 - a) * -14}px)`; return; }
      pop(n, at, t, .5);
      if (f.tone === 'bad' && n.classList.contains('last') && t > at) {
        const s = (1 - range(t, at, at + .6)) * 10; n.style.transform += ` translate(${Math.sin(t * 90) * s}px, ${Math.cos(t * 70) * s * .5}px)`;
      }
    });
  });
  R.shade.style.opacity = shade * .9;

  // --- pill ✓ bercahaya (menggantikan lower third seketika)
  let ckOn = 0;
  checks.forEach((c, i) => {
    const k = io(t, c, .45, .35), kb = range(t, c.start, c.start + .45, easeOutBack); ckOn = Math.max(ckOn, k);
    R.ck[i].style.opacity = k;
    R.ck[i].style.transform = `translateX(${(1 - kb) * -80}px) scale(${lerp(.9, 1, kb) + .02 * Math.sin(t * 4)})`;
    R.ck[i].style.boxShadow = `0 0 0 1px rgba(242,207,134,.25), 0 0 ${26 + 14 * Math.sin(t * 4)}px rgba(242,207,134,.6), inset 0 0 18px rgba(242,207,134,.15)`;
  });

  // --- lower third (selepas hook hingga sebelum PERCAYALAH.)
  const L0 = hook.end + .6, L1 = W.start - .2;
  const lin = range(t, L0, L0 + .8, easeOut), lout = range(t, L1 - .4, L1, easeInOut);
  R.lt.style.opacity = lin * (1 - lout) * (1 - ckOn);
  R.lt.style.transform = `translateY(${(1 - lin) * 60 + ckOn * 30}px)`;
  const tl = Math.max(0, t - L0), cyc = tl % 12, flip = range(cyc, 0, 1.0, easeInOut) * (tl > 1 ? 1 : 0);
  const rotY = lerp(-80, -16, range(t, L0, L0 + 1, easeOutBack)) + Math.sin(t * 1.2) * 6 + Math.sin(flip * Math.PI) * 22;
  $('ltb').style.transform = `rotateY(${rotY}deg) rotateX(${3 + Math.sin(t * .9) * 2}deg)`;
  $('ltfs').style.transform = `translateX(${lerp(-90, 90, range(tl % 6, 0, 1.2, easeInOut))}%)`;
  $('ltsw').style.transform = `translateX(${lerp(-100, 100, range(tl % 6, .2, 1.6, easeInOut))}%)`;
  // baris 3: gilir setiap 4s (CTA -> 4 USP), gelongsor ke atas
  const SEG = 4, nL = LT_LINES.length, cur = Math.floor(tl / SEG) % nL, inS = tl % SEG;
  [...$('ltl3').children].forEach((el, j) => {
    const prev = (cur - 1 + nL) % nL;
    if (j === cur)        { const k = tl < SEG ? 1 : range(inS, 0, .4, easeOut); el.style.opacity = k; el.style.transform = `translateY(${(1 - k) * 28}px)`; }
    else if (j === prev && tl >= SEG) { const k = range(inS, 0, .4, easeOut); el.style.opacity = 1 - k; el.style.transform = `translateY(${-k * 28}px)`; }
    else { el.style.opacity = 0; }
  });
  // animasi KLIK: tangan masuk -> tekan butang -> riak -> keluar (setiap 8s, bermula 2s selepas muncul)
  const kc = (tl - 2) % 8, kOn = tl > 2;
  const hin = kOn ? range(kc, 0, .6, easeOut) * (1 - range(kc, 1.9, 2.4, easeInOut)) : 0;
  const press = kOn ? range(kc, .7, .82) * (1 - range(kc, .82, 1.05)) : 0;
  const BX = 22 + 96 + 20 + 2 + 20, bx = 900 - 22 - 98, by = 84;              // pusat butang dalam kotak
  $('lthand').style.opacity = hin;
  $('lthand').style.transform = `translate(${bx - 10 + (1 - hin) * 90}px, ${by + 2 + (1 - hin) * 70}px) scale(${1 - press * .14}) rotate(${-12 + press * 4}deg)`;
  $('ltbtn').style.transform = `scale(${1 - press * .08})`;
  $('ltbtn').style.boxShadow = `0 8px 18px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.5), 0 0 ${press * 36}px rgba(255,220,150,${press * .9})`;
  const rp = kOn ? range(kc, .8, 1.5, easeOut) : 0;
  $('ltrip').style.opacity = kOn ? (1 - rp) * range(kc, .8, .85) : 0; $('ltrip').style.transform = `scale(${lerp(.4, 3.4, rp)})`;

  // --- PERCAYALAH.
  const wk = range(t, W.start, W.start + .35, easeOut);
  R.word.style.opacity = wk; R.word.firstElementChild.style.transform = `scale(${lerp(1.3, 1, wk) + (t - W.start) * .03})`;
  R.word.firstElementChild.style.letterSpacing = `${lerp(24, 6, wk)}px`;

  // --- SUBTITLE: perkataan aktif dalam pill emas
  const ci = D.captions.findIndex(c => t >= c.start && t < c.end);
  if (ci !== lastCap) {
    R.cap.innerHTML = ci >= 0 ? D.captions[ci].words.map(x => `<span class="${x.gold ? 'g' : ''}">${x.w}</span>`).join('') : '';
    lastCap = ci;
  }
  R.cap.style.opacity = (ci >= 0 && t < W.start) ? 1 : 0;
  if (ci >= 0) {
    const c = D.captions[ci];
    [...R.cap.children].forEach((sp, j) => {
      const at = c.words[j].t, nx = j + 1 < c.words.length ? c.words[j + 1].t : c.end;
      const k = range(t, at - .05, at + .18, easeOutBack);
      sp.style.opacity = t >= at - .05 ? 1 : .35;
      sp.classList.toggle('on', t >= at && t < nx);
      sp.style.transform = `translateY(${(1 - k) * 16}px) scale(${lerp(.92, 1, k) + (t >= at && t < at + .25 ? .06 * (1 - range(t, at, at + .25)) : 0)})`;
    });
  }
};
seek(0);
</script>
</body>
</html>
