<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<title>Overlay — subtitle + motion graphics (telus)</title>
<link rel="stylesheet" href="brand.css">
<style>
  /* ---------- Subtitle (Poppins, word-by-word) ---------- */
  #cap { position:absolute; left:70px; right:70px; top:1390px; text-align:center;
         font-family:'Poppins'; font-weight:700; font-size:60px; line-height:1.18; color:var(--ivory); }
  #cap span { display:inline-block; margin:0 9px; text-shadow:0 4px 18px rgba(0,0,0,.9), 0 0 3px rgba(0,0,0,.9);
              transition:none; }
  #cap span.g { color:var(--gold); }
  #cap span.dim { opacity:.0; }

  /* ---------- Letterbox untuk cold-open ---------- */
  .bar { position:absolute; left:0; right:0; height:150px; background:#000; }
  #barT { top:0; } #barB { bottom:0; }
  #flash { position:absolute; inset:0; background:#fff3d6; opacity:0; mix-blend-mode:screen; }

  /* ---------- Blok teks atas (kawasan selamat y 190–600) ---------- */
  .blk { position:absolute; left:60px; right:60px; top:200px; text-align:center; opacity:0; }
  .kicker { font-family:'Poppins'; font-weight:700; font-size:30px; letter-spacing:8px; color:var(--gold); }
  .ttl { font-family:'Cinzel'; font-weight:900; font-size:96px; line-height:1.05; color:var(--ivory);
         text-shadow:0 6px 28px rgba(0,0,0,.85); }
  .sub { font-family:'Poppins'; font-weight:600; font-size:34px; color:rgba(246,239,226,.9); margin-top:8px;
         text-shadow:0 3px 12px rgba(0,0,0,.9); }
  .shade { position:absolute; left:0; right:0; top:0; height:720px; opacity:0;
           background:linear-gradient(180deg, rgba(12,12,13,.82) 0%, rgba(12,12,13,.55) 55%, transparent 100%); }

  /* hook */
  #hook .l { white-space:nowrap; font-family:'Cinzel'; font-weight:900; color:var(--ivory); font-size:56px; letter-spacing:2px; line-height:1.15;
             text-shadow:0 6px 26px rgba(0,0,0,.9); }
  #hook .l3 { font-size:100px; color:var(--gold); text-shadow:0 2px 0 #8a6528, 0 10px 34px rgba(0,0,0,.9); }

  /* cards */
  .cards { display:flex; gap:28px; justify-content:center; margin-top:26px; }
  .card { width:430px; padding:26px 22px; border-radius:22px; text-align:left;
          background:linear-gradient(160deg, rgba(246,239,226,.16), rgba(246,239,226,.05));
          border:1.5px solid rgba(233,211,161,.6); backdrop-filter:blur(10px);
          box-shadow:0 24px 50px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.2); }
  .card .n { font-family:'Cinzel'; font-weight:900; font-size:54px; color:var(--gold); line-height:1; }
  .card .t { font-family:'Poppins'; font-weight:800; font-size:40px; color:var(--ivory); margin-top:8px; line-height:1.1; }

  /* list */
  .lst { margin:22px auto 0; width:860px; text-align:left; }
  .row { display:flex; align-items:center; gap:22px; margin:12px 0; padding:14px 26px; border-radius:16px;
         background:rgba(20,20,22,.55); border-left:5px solid var(--brick); }
  .row .x { width:46px; height:46px; border-radius:50%; background:var(--brick); color:#fff; display:flex; align-items:center; justify-content:center;
            font-family:'Poppins'; font-weight:800; font-size:28px; flex:none; }
  .row .t { font-family:'Poppins'; font-weight:700; font-size:40px; color:var(--ivory); }

  /* big 3D */
  #big .ttl { font-size:112px; color:var(--gold); letter-spacing:2px;
    text-shadow: 0 1px 0 #b98d46, 0 2px 0 #a97f3d, 0 3px 0 #997235, 0 4px 0 #88652e, 0 5px 0 #775826, 0 6px 0 #664b20,
                 0 14px 30px rgba(0,0,0,.85), 0 0 50px rgba(216,182,115,.35); }
  .persp { perspective:900px; }

  /* flow */
  .flow { display:flex; align-items:stretch; justify-content:center; gap:0; margin-top:26px; }
  .node { width:270px; padding:22px 16px; border-radius:20px; text-align:center; display:flex; align-items:center; justify-content:center;
          font-family:'Poppins'; font-weight:700; font-size:33px; line-height:1.15; color:var(--ivory);
          background:rgba(20,20,22,.6); border:2px solid var(--gold); box-shadow:0 18px 40px rgba(0,0,0,.45); }
  .arrow { width:44px; display:flex; align-items:center; justify-content:center; color:var(--gold); font-family:'Poppins'; font-weight:800; font-size:40px; }
  .bad .node { border-color:var(--brick); } .bad .arrow { color:#d9675f; }
  .bad .node.last { background:rgba(168,58,60,.85); }
  .good .node.last { background:linear-gradient(180deg,#f1dcab,#d4b06c); color:var(--charcoal); }

  #word { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; opacity:0;
          background:radial-gradient(ellipse at center, rgba(0,0,0,.35), rgba(0,0,0,.75)); }
  #word div { font-family:'Cinzel'; font-weight:900; font-size:108px; color:var(--gold);
              text-shadow:0 2px 0 #8a6528, 0 12px 40px rgba(0,0,0,.9), 0 0 60px rgba(216,182,115,.4); }

  /* ---------- LOWER THIRD: mockup buku + penulis + CTA ---------- */
  #lt { position:absolute; left:40px; top:1572px; width:860px; height:150px; opacity:0; }
  #lt .panel { position:absolute; left:58px; top:22px; right:0; height:116px; border-radius:20px;
     background:linear-gradient(100deg, rgba(18,18,20,.88), rgba(30,27,23,.80));
     border:1.5px solid rgba(233,211,161,.55); box-shadow:0 18px 40px rgba(0,0,0,.5); overflow:hidden; }
  #lt .panel .sw { position:absolute; inset:0; background:linear-gradient(100deg, transparent 40%, rgba(255,230,170,.18) 50%, transparent 60%); }
  #lt .bk { position:absolute; left:0px; top:-22px; width:124px; height:172px; perspective:600px; }
  #lt .bk .b3 { position:absolute; inset:0; transform-style:preserve-3d; }
  #lt .bk .fr { position:absolute; inset:0; background:url('../assets/cover-buku-rata.jpg') center/cover; border-radius:2px 5px 5px 2px;
     box-shadow:0 12px 26px rgba(0,0,0,.6), inset 3px 0 5px rgba(0,0,0,.25); overflow:hidden; }
  #lt .bk .fr i { position:absolute; inset:-30%; background:linear-gradient(105deg, transparent 42%, rgba(255,240,200,.75) 50%, transparent 58%); mix-blend-mode:screen; }
  #lt .bk .sp { position:absolute; left:0; top:0; width:12px; height:100%; background:linear-gradient(90deg,#d9d2c1,#f3eee2);
     transform-origin:left; transform:rotateY(-90deg); }
  #lt .tx { position:absolute; left:150px; top:36px; right:170px; }
  #lt .l1 { font-family:'Poppins'; font-weight:600; font-size:21px; letter-spacing:3px; color:var(--gold); white-space:nowrap; }
  #lt .l2 { font-family:'Cinzel'; font-weight:700; font-size:31px; color:var(--ivory); white-space:nowrap; margin-top:2px; }
  #lt .l3 { position:relative; height:30px; margin-top:4px; }
  #lt .l3 div { position:absolute; left:0; top:0; font-family:'Poppins'; font-weight:600; font-size:22px; color:rgba(246,239,226,.88); white-space:nowrap; }
  #lt .l3 b { color:var(--gold); font-weight:800; }
  #lt .btn { position:absolute; right:18px; top:58px; padding:12px 20px; border-radius:40px; font-family:'Poppins'; font-weight:800;
     font-size:21px; letter-spacing:1px; color:var(--charcoal); background:linear-gradient(180deg,#f1dcab,#d4b06c);
     box-shadow:0 8px 18px rgba(0,0,0,.45); }
</style>
</head>
<body>
<div class="stage">
  <div class="shade" id="shade"></div>
  <div class="bar" id="barT"></div><div class="bar" id="barB"></div>
  <div class="blk" id="hook"></div>
  <div class="blk" id="title"></div>
  <div class="blk" id="cards"></div>
  <div class="blk" id="list"></div>
  <div class="blk persp" id="big"></div>
  <div class="blk" id="flowG"></div>
  <div class="blk" id="flowB"></div>
  <div id="cap"></div>
  <div id="lt">
    <div class="panel"><div class="sw" id="ltsw"></div></div>
    <div class="bk"><div class="b3" id="ltb"><div class="sp"></div><div class="fr"><i id="ltfs"></i></div></div></div>
    <div class="tx">
      <div class="l1">PERKONGSIAN DARIPADA PENULIS</div>
      <div class="l2">Waleed Amir &amp; Wardah Kasih</div>
      <div class="l3"><div id="cta1">📖 Dapatkan buku <b>NAK KAHWIN TAPI ..</b></div><div id="cta2">🛒 Kini di <b>TikTok Shop · Nuktah Books</b></div></div>
    </div>
    <div class="btn" id="ltbtn">DAPATKAN</div>
  </div>
  <div id="word"><div></div></div>
  <div id="flash"></div>
</div>
<script src="anim.js"></script>
<script src="overlay-data.js"></script>
<script>
const D = window.DATA;
window.DURATION = D.speech_end;
const E = (k, i = 0) => D.events.filter(e => e.kind === k)[i];

// ---- bina DOM sekali
const hook = E('hook');
$('hook').innerHTML = hook.lines.map((l, i) => `<div class="l l${i+1}">${l}</div>`).join('');
const ti = E('title');
$('title').innerHTML = `<div class="kicker">${ti.kicker}</div><div class="ttl">${ti.title}</div><div class="sub">${ti.sub}</div>`;
const ca = E('cards');
$('cards').innerHTML = `<div class="kicker">${ca.title}</div><div class="cards">` +
  ca.items.map(it => `<div class="card"><div class="n">${it.n}</div><div class="t">${it.t}</div></div>`).join('') + `</div>`;
const li = E('list');
$('list').innerHTML = `<div class="kicker">${li.title}</div><div class="lst">` +
  li.items.map(it => `<div class="row"><div class="x">✕</div><div class="t">${it.t}</div></div>`).join('') + `</div>`;
const bg = E('big');
$('big').innerHTML = `<div class="kicker">${bg.kicker}</div><div class="ttl">${bg.title}</div><div class="sub">${bg.sub}</div>`;
const fg = E('flow', 0), fb = E('flow', 1);
const flowHTML = (f) => `<div class="kicker">${f.title}</div><div class="flow ${f.tone}">` +
  f.items.map((it, i) => (i ? '<div class="arrow">›</div>' : '') + `<div class="node ${i === f.items.length - 1 ? 'last' : ''}">${it.t}</div>`).join('') + '</div>';
$('flowG').innerHTML = flowHTML(fg); $('flowB').innerHTML = flowHTML(fb);
$('word').firstElementChild.textContent = E('word').title;

// in/out umum untuk blok
function blockIO(el, e, t, rise = 30) {
  const k = range(t, e.start, e.start + .5, easeOut) * (1 - range(t, e.end - .4, e.end));
  el.style.opacity = k; el.style.transform = `translateY(${(1 - range(t, e.start, e.start + .6, easeOut)) * rise}px)`;
  return k;
}
function pop(el, at, t, dur = .45) {
  const k = range(t, at, at + dur, easeOutBack); el.style.opacity = range(t, at, at + .2);
  el.style.transform = `translateY(${(1 - k) * 40}px) scale(${lerp(.85, 1, k)})`;
}

let lastCap = -1;
window.seek = (t) => {
  // ---------- COLD OPEN HOOK
  const hk = t < hook.end + .5;
  const bars = 1 - range(t, hook.end - .2, hook.end + .4, easeInOut);
  $('barT').style.transform = `translateY(${-(1 - bars) * 150}px)`; $('barB').style.transform = `translateY(${(1 - bars) * 150}px)`;
  $('flash').style.opacity = .55 * (1 - range(t, 0, .35)) + .45 * (range(t, hook.end - .08, hook.end) * (1 - range(t, hook.end, hook.end + .3)));
  $('hook').style.opacity = hk ? (1 - range(t, hook.end - .25, hook.end)) : 0;
  $('hook').style.top = '190px';
  [...$('hook').children].forEach((el, i) => {
    const at = [.05, .55, 1.25][i]; const k = range(t, at, at + .5, easeOut);
    el.style.opacity = k; el.style.filter = `blur(${(1 - k) * 10}px)`;
    el.style.transform = `scale(${lerp(1.25, 1, k) + (t - at) * .01})`; el.style.letterSpacing = `${lerp(14, 2, k)}px`;
  });

  // ---------- blok-blok topik
  let shade = 0;
  shade = Math.max(shade, blockIO($('title'), ti, t));
  const tk = range(t, ti.title_at, ti.title_at + .7, easeOut);
  $('title').children[1].style.opacity = tk; $('title').children[1].style.letterSpacing = `${lerp(30, 0, tk)}px`;
  $('title').children[2].style.opacity = range(t, ti.title_at + .4, ti.title_at + .9);

  shade = Math.max(shade, blockIO($('cards'), ca, t));
  [...$('cards').querySelectorAll('.card')].forEach((c, i) => {
    pop(c, ca.items[i].at, t, .55);
    c.style.transform += ` translateY(${Math.sin(t * 1.6 + i * 1.7) * 6}px) rotate(${(i ? 1 : -1) * 1.5}deg)`;
  });

  shade = Math.max(shade, blockIO($('list'), li, t));
  [...$('list').querySelectorAll('.row')].forEach((r, i) => {
    const k = range(t, li.items[i].at, li.items[i].at + .45, easeOut);
    r.style.opacity = k; r.style.transform = `translateX(${(1 - k) * -60}px)`;
  });

  shade = Math.max(shade, blockIO($('big'), bg, t));
  const bk = range(t, bg.title_at, bg.title_at + .9, easeOut);
  const bt = $('big').children[1];
  bt.style.opacity = bk;
  bt.style.transform = `translateZ(${lerp(-300, 0, bk)}px) rotateX(${8 + Math.sin(t * .9) * 4}deg) rotateY(${Math.sin(t * .6) * 7}deg)`;
  $('big').children[2].style.opacity = range(t, bg.title_at + .6, bg.title_at + 1.1);

  for (const [id, f] of [['flowG', fg], ['flowB', fb]]) {
    shade = Math.max(shade, blockIO($(id), f, t));
    const kids = [...$(id).querySelector('.flow').children];
    kids.forEach((el, j) => {
      const idx = Math.floor((j + 1) / 2); const at = f.items[idx].at - (j % 2 ? .25 : 0);
      if (el.classList.contains('arrow')) { const k = range(t, at, at + .3); el.style.opacity = k; el.style.transform = `translateX(${(1 - k) * -14}px)`; return; }
      pop(el, at, t, .5);
      if (f.tone === 'bad' && el.classList.contains('last') && t > at) {
        const s = (1 - range(t, at, at + .6)) * 10; el.style.transform += ` translate(${Math.sin(t * 90) * s}px, ${Math.cos(t * 70) * s * .5}px)`;
      }
    });
  }
  $('shade').style.opacity = Math.max(shade * .9, hk ? .75 * (1 - range(t, hook.end - .25, hook.end)) : 0);

  // ---------- PERCAYALAH.
  const w = E('word'); const wk = range(t, w.start, w.start + .35, easeOut);
  $('word').style.opacity = wk; $('word').firstElementChild.style.transform = `scale(${lerp(1.3, 1, wk) + (t - w.start) * .03})`;
  $('word').firstElementChild.style.letterSpacing = `${lerp(24, 6, wk)}px`;


  // ---------- LOWER THIRD (sepanjang video, selepas hook hingga sebelum PERCAYALAH.)
  const L0 = hook.end + .6, L1 = E('word').start - .2;
  const lin = range(t, L0, L0 + .8, easeOut), lout = range(t, L1 - .4, L1, easeInOut);
  $('lt').style.opacity = lin * (1 - lout);
  $('lt').style.transform = `translateX(${(1 - lin) * -120 + lout * -60}px)`;
  // buku: masuk dengan putaran, kemudian ayunan lembut + "attention flip" setiap 12s
  const tl = Math.max(0, t - L0), cyc = tl % 12, flip = range(cyc, 0, 1.0, easeInOut) * (tl > 1 ? 1 : 0);
  const rotY = lerp(-80, -18, range(t, L0, L0 + 1, easeOutBack)) + Math.sin(t * 1.2) * 8 + Math.sin(flip * Math.PI) * 25;
  $('ltb').style.transform = `rotateY(${rotY}deg) rotateX(${4 + Math.sin(t * .9) * 2}deg) translateY(${Math.sin(t * 1.5) * 3 - Math.sin(flip * Math.PI) * 8}px)`;
  $('ltfs').style.transform = `translateX(${lerp(-90, 90, range(tl % 6, 0, 1.2, easeInOut))}%)`;
  $('ltsw').style.transform = `translateX(${lerp(-100, 100, range(tl % 6, .2, 1.6, easeInOut))}%)`;
  // CTA bergilir setiap 5s
  const ph = tl % 10, c2 = range(ph, 5, 5.4) * (1 - range(ph, 9.6, 10));
  $('cta1').style.opacity = 1 - c2; $('cta1').style.transform = `translateY(${-c2 * 14}px)`;
  $('cta2').style.opacity = c2;     $('cta2').style.transform = `translateY(${(1 - c2) * 14}px)`;
  const pulse = 1 + .06 * Math.max(0, Math.sin(t * 3.2)) * (Math.sin(t * .8) > .3 ? 1 : 0);
  $('ltbtn').style.transform = `scale(${pulse})`;

  // ---------- SUBTITLE
  const ci = D.captions.findIndex(c => t >= c.start && t < c.end);
  const showCap = ci >= 0 && t < w.start;
  if (ci !== lastCap) {
    $('cap').innerHTML = ci >= 0 ? D.captions[ci].words.map(x => `<span class="${x.gold ? 'g' : ''}">${x.w}</span>`).join('') : '';
    lastCap = ci;
  }
  $('cap').style.opacity = showCap ? 1 : 0;
  if (ci >= 0) {
    const c = D.captions[ci];
    [...$('cap').children].forEach((sp, j) => {
      const at = c.words[j].t; const k = range(t, at - .05, at + .18, easeOutBack);
      sp.style.opacity = range(t, at - .08, at + .05) * .65 + .35 * (t >= c.start ? 1 : 0);
      if (t >= at - .05) sp.style.opacity = 1;
      sp.style.transform = `translateY(${(1 - k) * 18}px) scale(${lerp(.92, 1, k) + (t >= at && t < at + .25 ? .06 * (1 - range(t, at, at + .25)) : 0)})`;
    });
  }
};
seek(0);
</script>
</body>
</html>
